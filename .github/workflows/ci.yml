name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moodymate
          POSTGRES_PASSWORD: moodymate
          POSTGRES_DB: moodymate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U moodymate -d moodymate_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENV: test
      DATABASE_URL: postgresql+asyncpg://moodymate:moodymate@localhost:5432/moodymate_test
      TEST_DATABASE_URL: postgresql+asyncpg://moodymate:moodymate@localhost:5432/moodymate_test
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"   # the uv backend/Dockerfile uses (UV_IMAGE)
      - name: Install (BE-34.1, D-62 §5; locked, so a stale uv.lock fails here)
        run: |
          uv sync --locked --extra dev --extra s3
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        env:
          UV_PYTHON_DOWNLOADS: never
      - name: A pyproject/lock mismatch fails the locked install (BE-34.1; on a temp copy)
        run: |
          set -uo pipefail
          tmp="$RUNNER_TEMP/lock-mismatch"
          rm -rf "$tmp" && mkdir -p "$tmp"
          sha256sum pyproject.toml uv.lock >"$RUNNER_TEMP/checkout.sha256"
          cp pyproject.toml uv.lock "$tmp/"
          (
            cd "$tmp"
            uv lock --check || { echo "::error::the copy does not match before the edit"; exit 1; }
            # The deliberate mismatch: a dependency added to the copy's pyproject, not locked.
            uv add --frozen "six>=1.16"
            grep -n '"six>=1.16"' pyproject.toml
            # `|| x=$?`: the run shell is `bash -e`, and these two are expected to fail.
            lock=0; uv lock --check || lock=$?
            sync=0; uv sync --locked --extra dev --no-install-project || sync=$?
            echo "uv lock --check on the mismatch: exit ${lock}"
            echo "uv sync --locked on the mismatch: exit ${sync}"
            [ "$lock" -ne 0 ] && [ "$sync" -ne 0 ] \
              || { echo "::error::a pyproject/lock mismatch was not refused"; exit 1; }
          ) || exit 1
          # The checkout's own pyproject.toml and uv.lock were never edited.
          sha256sum -c "$RUNNER_TEMP/checkout.sha256"
        env:
          UV_PYTHON_DOWNLOADS: never
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy app scripts
      - name: Migration round trip (D-02)
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Tests
        run: pytest -q -m "not ws1 and not ws2 and not ws3"
      - name: WS1 verification suite (BE-6.3; prints the route x role matrix)
        run: pytest -m ws1 -v
      - name: WS2 verification suite (BE-13.2; prints the WS2 route x role matrix)
        run: pytest -m ws2 -v
      - name: WS3 verification suite (BE-18.3; prints the WS3 route x role matrix)
        run: pytest -m ws3 -v
      - name: OpenAPI drift check (D-05)
        run: python -m scripts.export_openapi --check
      - name: Python dependency audit (BE-28.1, D-55 §4; reads the lock, BE-34.1)
        # The exported lock with the dev extra: the same set the locked install above puts in
        # place. The project itself (`-e .`) is not on PyPI, so pip-audit skips it.
        run: |
          uv export --locked --no-hashes --format requirements-txt --extra dev --extra s3 -o "$RUNNER_TEMP/req.txt"
          pip-audit -r "$RUNNER_TEMP/req.txt" --no-deps --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Generated API types are current
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Dependency audit gate (BE-28.1, D-55 §4; high/critical must be allowlisted)
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit.json" || true
          python3 ../backend/scripts/check_audit_allowlist.py "$RUNNER_TEMP/audit.json" audit-allowlist.json
      - name: Build
        run: npm run build
        env:
          # FE-28.3: next build fails without it in production (D-55 §5).
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

  e2e:
    # FE-6.2: Playwright smoke against the real stack (migrated, seeded DB; backend in
    # dev-auth mode with ENV=test; production frontend build).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moodymate
          POSTGRES_PASSWORD: moodymate
          POSTGRES_DB: moodymate_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U moodymate -d moodymate_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENV: test
      DATABASE_URL: postgresql+asyncpg://moodymate:moodymate@localhost:5432/moodymate_e2e
      E2E_DATABASE_URL: postgresql+asyncpg://moodymate:moodymate@localhost:5432/moodymate_e2e
      E2E_UVICORN: uvicorn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"   # the uv backend/Dockerfile uses (UV_IMAGE)
      - name: Install backend (BE-34.1; locked)
        working-directory: backend
        run: |
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        env:
          UV_PYTHON_DOWNLOADS: never
      - name: Migrate and seed
        working-directory: backend
        run: alembic upgrade head
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          # FE-28.3; must match the backend port Playwright starts (E2E_API_PORT, default 8000).
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      - name: Playwright smoke
        working-directory: frontend
        run: npm run e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14

  images:
    # BE-34.2 and FE-34.1 (D-62 §5): both images from a clean checkout; they run as non-root and
    # carry no secret in `docker history`; the frontend image build fails without
    # NEXT_PUBLIC_API_BASE_URL and succeeds with a placeholder; compose `prod` comes up migrated
    # and ready, with metrics on the internal network only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The checkout is clean (nothing untracked or ignored)
        run: |
          git status --porcelain --ignored
          test -z "$(git status --porcelain --ignored)"
      - name: Build the backend image (BE-34.2)
        run: docker build --progress=plain -t moodymate-backend:ci backend
      - name: Frontend image needs NEXT_PUBLIC_API_BASE_URL (FE-34.1; prints both exit codes)
        run: bash frontend/scripts/check-image-build-arg.sh moodymate-frontend:ci https://api.example.test
      - name: Compose prod profile (BE-34.2; one-shot migrate, ready 200, frontend / 200)
        # Builds through compose (the `:ci` tags, from the build cache of the steps above).
        run: bash scripts/check-compose-prod.sh
        env:
          MOODYMATE_IMAGE_TAG: ci
      - name: Images run as non-root, no secret in their history or the env example (BE-34.2)
        # The images compose just ran.
        run: bash scripts/check-images.sh moodymate-backend:ci moodymate-frontend:ci
