name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moodymate
          POSTGRES_PASSWORD: moodymate
          POSTGRES_DB: moodymate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U moodymate -d moodymate_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENV: test
      DATABASE_URL: postgresql+asyncpg://moodymate:moodymate@localhost:5432/moodymate_test
      TEST_DATABASE_URL: postgresql+asyncpg://moodymate:moodymate@localhost:5432/moodymate_test
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy app scripts
      - name: Migration round trip (D-02)
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Tests
        run: pytest -q
      - name: OpenAPI drift check (D-05)
        run: python -m scripts.export_openapi --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Generated API types are current
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
