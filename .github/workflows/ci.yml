name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moodymate
          POSTGRES_PASSWORD: moodymate
          POSTGRES_DB: moodymate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U moodymate -d moodymate_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENV: test
      DATABASE_URL: postgresql+asyncpg://moodymate:moodymate@localhost:5432/moodymate_test
      TEST_DATABASE_URL: postgresql+asyncpg://moodymate:moodymate@localhost:5432/moodymate_test
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy app scripts
      - name: Migration round trip (D-02)
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Tests
        run: pytest -q -m "not ws1 and not ws2 and not ws3"
      - name: WS1 verification suite (BE-6.3; prints the route x role matrix)
        run: pytest -m ws1 -v
      - name: WS2 verification suite (BE-13.2; prints the WS2 route x role matrix)
        run: pytest -m ws2 -v
      - name: WS3 verification suite (BE-18.3; prints the WS3 route x role matrix)
        run: pytest -m ws3 -v
      - name: OpenAPI drift check (D-05)
        run: python -m scripts.export_openapi --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Generated API types are current
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    # FE-6.2: Playwright smoke against the real stack (migrated, seeded DB; backend in
    # dev-auth mode with ENV=test; production frontend build).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moodymate
          POSTGRES_PASSWORD: moodymate
          POSTGRES_DB: moodymate_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U moodymate -d moodymate_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENV: test
      DATABASE_URL: postgresql+asyncpg://moodymate:moodymate@localhost:5432/moodymate_e2e
      E2E_DATABASE_URL: postgresql+asyncpg://moodymate:moodymate@localhost:5432/moodymate_e2e
      E2E_UVICORN: uvicorn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Migrate and seed
        working-directory: backend
        run: alembic upgrade head
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Playwright smoke
        working-directory: frontend
        run: npm run e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14
