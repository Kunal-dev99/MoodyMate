[project]
name = "moodymate-backend"
version = "0.1.0"
description = "MoodyMate Financial Risk Platform — backend (modular monolith)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162,<0.163",
    # D-55: starlette >= 1.3.1 fixes PYSEC-2026-161/248/249/1941/1942/2280/2281.
    "starlette>=1.3.1,<2",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<1.15",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyjwt[crypto]>=2.9,<3",
    # D-17: XLSX in read_only/data_only mode; defusedxml hardens its XML parsing.
    "openpyxl>=3.1,<3.2",
    "defusedxml>=0.7,<0.8",
    # BE-8.4: multipart uploads (POST /imports).
    "python-multipart>=0.0.20,<0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.4,<2",
    "httpx>=0.27,<0.28",
    "ruff>=0.8,<0.9",
    "mypy>=1.13,<2",
    "openapi-spec-validator>=0.7,<0.8",
    "types-openpyxl>=3.1,<3.2",
    # BE-28.1 (D-55 §4): CI audits the installed environment for known vulnerabilities.
    "pip-audit>=2.7,<3",
    # BE-29.4 (D-52 §6): property tests, derandomised with a fixed max_examples (D-26 folds).
    "hypothesis>=6.100,<7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"app/tests/**" = ["S105", "S106", "S608"]  # fake secrets; SQL with constant table names
"scripts/make_synthetic_samples.py" = ["S311"]  # seeded, reproducible synthetic data by design

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["app/db/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["asyncpg"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# BE-14.6 (c), Phase 8 review D3: a warning from openpyxl is an error under pytest. The app
# drops them (app.ingestion.adapters.xlsx_adapter.silence_openpyxl_warnings), so a test
# never sees one unless a workbook would have printed one in production.
filterwarnings = [
    'error::Warning:openpyxl(\..*)?\Z',
]
markers = [
    "db: needs a reachable PostgreSQL (DATABASE_URL); required when REQUIRE_DB=1",
    "ws1: WS1 verification suite (BE-6.3); prints the route x role matrix",
    "ws2: WS2 verification suite (BE-13.2); prints the WS2 route x role matrix",
    "ws3: WS3 verification suite (BE-18.3); prints the WS3 route x role matrix",
]
